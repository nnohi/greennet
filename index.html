<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenNet — 복지 사각지대 위험도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F9F6;--card:#fff;--ink:#14291D;--mut:#6B8174;--line:#E3EDE6;--brand:#1B6B43;--on:#fff;--soft:#E7F4EC;--lo:221,241,228;--hi:20,92,58;--sh:0 1px 2px rgba(20,41,29,.04),0 8px 24px rgba(20,41,29,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1A13;--card:#15251B;--ink:#E8F3EC;--mut:#8DA698;--line:#243A2D;--brand:#5CC48B;--on:#0E1A13;--soft:#1B3225;--lo:200,232,213;--hi:44,140,88;--sh:none}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 6px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.35rem;letter-spacing:-.02em}.logo svg{width:30px;height:30px}
.sub{color:var(--mut);font-size:.85rem}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;padding:9px 18px;border-radius:99px;cursor:pointer}
.tab:hover{background:var(--soft)}.tab.on{background:var(--brand);color:var(--on)}.tab:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.view{animation:fade .35s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);border:1px solid var(--line);padding:22px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 4px}.note{margin:0 0 14px;font-size:.84rem;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.stats .card{margin:0}
.stat b{display:block;font-size:1.6rem;line-height:1.3;font-weight:900}.stat span{color:var(--mut);font-size:.85rem}
@media(max-width:700px){.stats{grid-template-columns:1fr;gap:10px}}
.row{display:grid;grid-template-columns:2.2em 3.2em 1fr 3em;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:14px;padding:9px 10px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:hover{background:var(--soft)}.row i{display:block;height:10px;border-radius:5px}.row em{font-style:normal;text-align:right;font-size:.9rem}
.no{width:1.9em;height:1.9em;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.lead{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.lead{grid-template-columns:1fr}}
.lead div{background:var(--soft);border-radius:18px;padding:14px 16px}.lead span{font-size:.8rem;color:var(--mut)}.lead b{display:block;font-size:1.1rem}
svg.m{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.t{cursor:pointer}.t circle{filter:drop-shadow(0 3px 5px rgba(20,41,29,.16))}.t:hover circle{stroke:var(--brand);stroke-width:2}.t:focus-visible{outline:none}.t:focus-visible circle{stroke:var(--ink);stroke-width:3}
.land{fill:var(--soft);stroke:var(--line);stroke-width:2;stroke-linejoin:round}
.leg{display:flex;align-items:center;justify-content:center;gap:10px;font-size:.78rem;color:var(--mut);margin-top:12px}.leg i{width:140px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgb(var(--lo)),rgb(var(--hi)))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;padding:6px 14px;border-radius:99px;cursor:pointer}.chip:hover{background:var(--soft)}.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on);font-weight:700}
.det h3{margin:0;font-size:1.5rem}.tag{display:inline-block;margin:6px 0 4px;padding:3px 12px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:.82rem;font-weight:700}
.ind{display:grid;grid-template-columns:8em 1fr 12.5em;align-items:center;gap:12px;margin:14px 0;font-size:.92rem}@media(max-width:560px){.ind{grid-template-columns:1fr;gap:4px}}
.trk{position:relative;height:10px;border-radius:5px;background:var(--soft)}.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--brand)}.trk u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.ind small{color:var(--mut)}.adv{margin-top:6px;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:.93rem}
.sl{display:grid;grid-template-columns:5em 1fr 2.6em;align-items:center;gap:10px;font-size:.9rem;margin:10px 0}.sl input{width:100%;accent-color:var(--brand)}.sl em{font-style:normal;font-size:.8rem;color:var(--mut);text-align:right}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:7px 16px;border-radius:99px;cursor:pointer;margin-top:6px}
.small{color:var(--mut);font-size:.8rem;line-height:1.7}footer{padding:10px 0 36px;color:var(--mut);font-size:.78rem}
</style></head><body><div class="wrap">
<div class="top"><div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#1B6B43"/><path d="M12 27c0-9 6-14 16-14 0 9-5 15-14 15z" fill="#DDF1E4"/></svg>GreenNet</div><div class="sub">복지 사각지대 위험도 · 2025년 기준</div></div>
<nav class="tabs" id="tabs" role="tablist"></nav>
<main id="view"></main>
<footer>© GreenNet · 위험도는 지역 간 상대 점수예요.</footer></div>
<script>
const D=[["서울",20.4,40.5,5.0],["부산",25.3,37.8,7.9],["대구",22.1,36.1,7.3],["인천",18.8,33.1,6.5],["광주",18.8,37.7,7.6],["대전",19.1,40.3,5.9],["울산",18.6,32.3,4.6],["세종",12.3,33.3,2.6],["경기",17.7,32.2,4.0],["강원",26.8,40.1,6.2],["충북",23.1,39.7,5.5],["충남",23.4,38.7,4.9],["전북",26.6,38.9,8.2],["전남",28.5,38.3,6.5],["경북",27.5,39.6,6.6],["경남",23.2,36.2,6.1],["제주",20.1,34.3,6.1]];
const LL={서울:[37.57,126.98],인천:[37.46,126.6],경기:[37.45,127.55],강원:[37.75,128.3],충남:[36.5,126.8],세종:[36.5,127.29],충북:[36.75,127.8],경북:[36.45,128.85],전북:[35.7,127.15],대전:[36.35,127.4],대구:[35.87,128.6],울산:[35.55,129.25],광주:[35.16,126.85],전남:[34.9,126.9],경남:[35.35,128.3],부산:[35.15,129.05],제주:[33.4,126.55]};
const PJ=(la,lo)=>[(lo-125.9)*56+45,(38.7-la)*68+20];
const COAST=[[37.9,126.7],[38.05,127.5],[38.6,128.4],[37.75,128.95],[36.9,129.4],[36.0,129.5],[35.5,129.45],[35.1,129.2],[34.9,128.7],[34.9,128.0],[34.6,127.4],[34.4,126.9],[34.4,126.3],[35.0,126.3],[35.6,126.5],[36.0,126.6],[36.6,126.4],[37.1,126.8],[37.5,126.4],[37.8,126.6]];
const LAND=(()=>{const q=COAST.map(([a,b])=>PJ(a,b)),n=q.length;let d=`M${q[0][0].toFixed(1)},${q[0][1].toFixed(1)}`;for(let i=0;i<n;i++){const p0=q[(i-1+n)%n],p1=q[i],p2=q[(i+1)%n],p3=q[(i+2)%n],c=(u,v,w,k)=>(u+(v-w)/6*k).toFixed(1);d+=`C${c(p1[0],p2[0],p0[0],1)},${c(p1[1],p2[1],p0[1],1)} ${c(p2[0],p1[0],p3[0],1)},${c(p2[1],p1[1],p3[1],1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d+"Z"})();
const P={};Object.keys(LL).forEach(n=>P[n]=PJ(...LL[n]));
(()=>{const A=JSON.parse(JSON.stringify(P)),ns=Object.keys(P);for(let it=0;it<150;it++){for(let a=0;a<ns.length;a++)for(let b=a+1;b<ns.length;b++){const p=P[ns[a]],q=P[ns[b]];let dx=q[0]-p[0],dy=q[1]-p[1],d=Math.hypot(dx,dy)||.01;if(d<47){const f=(47-d)/2/d;p[0]-=dx*f;p[1]-=dy*f;q[0]+=dx*f;q[1]+=dy*f}}ns.forEach(n=>{P[n][0]+=(A[n][0]-P[n][0])*.03;P[n][1]+=(A[n][1]-P[n][1])*.03;P[n][0]=Math.min(272,Math.max(28,P[n][0]));P[n][1]=Math.min(410,Math.max(28,P[n][1]))})}})();
const K=["고령 인구","1인 가구","수급자"],ADV=["방문 돌봄과 노인맞춤돌봄서비스를 늘려요.","안부 확인과 고독사 예방 프로그램을 강화해요.","차상위 대상자를 찾아가서 발굴하고 상담해요."];
const TABS=[["home","개요"],["map","지도"],["rank","순위"],["detail","지역 상세"],["set","설정·출처"]];
const W=[1,1,1],DW=[1,1,1];let sel="",tab="home",sortK=-1;
const mm=i=>{const v=D.map(r=>r[1+i]),a=Math.min(...v),b=Math.max(...v);return r=>(r[1+i]-a)/(b-a)},N=K.map((_,i)=>mm(i));
const avgK=K.map((_,i)=>D.reduce((a,r)=>a+r[1+i],0)/D.length),maxK=K.map((_,i)=>Math.max(...D.map(r=>r[1+i])));
const mix=(v,a,b)=>Math.round(a+(b-a)*v/100),$=id=>document.getElementById(id);
function col(v){const s=getComputedStyle(document.documentElement),lo=s.getPropertyValue("--lo").split(",").map(Number),hi=s.getPropertyValue("--hi").split(",").map(Number);return`rgb(${mix(v,lo[0],hi[0])},${mix(v,lo[1],hi[1])},${mix(v,lo[2],hi[2])})`}
function calc(){const t=W.reduce((a,b)=>a+b,0)||1;return D.map(r=>{const c=N.map((f,i)=>f(r)*W[i]);return{n:r[0],v:[r[1],r[2],r[3]],s:Math.round(c.reduce((a,b)=>a+b,0)/t*1000)/10,k:c.indexOf(Math.max(...c))}}).sort((a,b)=>b.s-a.s)}
function go(t){location.hash=t}
function pick(n){sel=n;go("detail")}
function detail(c,R){const rk=R.indexOf(c)+1;return`<div class="det"><h3>${c.n}</h3><span class="tag">위험도 ${c.s}점 · ${R.length}개 중 ${rk}위</span>`+K.map((k,i)=>{const d=c.v[i]-avgK[i];return`<div class="ind"><span>${k} 비율</span><div class="trk"><i style="width:${c.v[i]/maxK[i]*100}%"></i><u style="left:${avgK[i]/maxK[i]*100}%" title="시도 평균"></u></div><span><b>${c.v[i].toFixed(1)}%</b> <small>평균보다 ${d>0?"+":""}${d.toFixed(1)}%p</small></span></div>`}).join("")+`<div class="adv"><b>${K[c.k]}</b> 요인이 가장 크게 작용해요. ${ADV[c.k]}</div></div>`}
const V={
home(R){const avg=(R.reduce((a,r)=>a+r.s,0)/R.length).toFixed(1);
 return`<div class="stats">${[["분석 지역",R.length+"개 시도"],["위험도 1위",R[0].n+" "+R[0].s+"점"],["평균 위험도",avg+"점"]].map(([a,b])=>`<div class="card stat"><b>${b}</b><span>${a}</span></div>`).join("")}</div>
 <section class="card"><h2>가장 먼저 살펴볼 지역</h2><p class="note">위험도 상위 3곳이에요. 누르면 상세 정보로 이동해요.</p>${R.slice(0,3).map((r,i)=>`<button class="row" onclick="pick('${r.n}')"><span class="no">${i+1}</span><span>${r.n}</span><i style="width:${r.s}%;background:${col(r.s)}"></i><em>${r.s}</em></button>`).join("")}</section>
 <section class="card"><h2>지표별 1위</h2><p class="note">지표마다 가장 높은 시도예요.</p><div class="lead">${K.map((k,i)=>{const m=D.reduce((a,r)=>r[1+i]>a[1+i]?r:a);return`<div><span>${k} 비율</span><b>${m[0]} ${m[1+i].toFixed(1)}%</b></div>`}).join("")}</div></section>`},
map(R){return`<section class="card"><h2>시도별 위험도</h2><p class="note">진한 초록일수록 위험도가 높아요. 동그라미를 누르면 상세 정보로 이동해요.</p><svg class="m" viewBox="0 0 300 440" role="img" aria-label="시도별 위험도 지도"><path class="land" d="${LAND}"/>`+R.map(r=>{const[x,y]=P[r.n],rad=15+r.s*.11,dk=r.s>45;return`<g class="t" tabindex="0" role="button" aria-label="${r.n} 위험도 ${r.s}점" onclick="pick('${r.n}')" onkeydown="if(event.key==='Enter')pick('${r.n}')"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" fill="${col(r.s)}" stroke="transparent" stroke-width="3"/><text x="${x.toFixed(1)}" y="${(y+1).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${dk?"#fff":"#14291D"}" pointer-events="none">${r.n}</text><text x="${x.toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${dk?"#D6EEDF":"#4B6455"}" pointer-events="none">${r.s}</text></g>`}).join("")+`</svg><div class="leg">낮음<i></i>높음</div></section>`},
rank(R){const L=sortK<0?R.map(r=>[r,r.s,r.s]):R.map(r=>[r,r.v[sortK],r.v[sortK]/maxK[sortK]*100]).sort((a,b)=>b[1]-a[1]);
 return`<section class="card"><h2>순위</h2><p class="note">기준을 고르면 순서가 바뀌어요.</p><div class="chips">${[["종합 위험도",-1],...K.map((k,i)=>[k+" 비율",i])].map(([n,i])=>`<button class="chip${i===sortK?" on":""}" onclick="sortK=${i};draw()">${n}</button>`).join("")}</div>`+L.map(([r,val,w],i)=>`<button class="row" onclick="pick('${r.n}')"><span class="no">${i+1}</span><span>${r.n}</span><i style="width:${Math.max(w,3)}%;background:${col(sortK<0?r.s:w)}"></i><em>${sortK<0?val:val.toFixed(1)+"%"}</em></button>`).join("")+`</section>`},
detail(R){if(!sel)sel=R[0].n;const c=R.find(r=>r.n===sel);return`<section class="card"><h2>지역 선택</h2><div class="chips">${R.map(r=>`<button class="chip${r.n===sel?" on":""}" onclick="sel='${r.n}';draw()">${r.n}</button>`).join("")}</div>${detail(c,R)}</section>`},
set(R){return`<section class="card"><h2>지표 가중치</h2><p class="note">중요하게 보는 지표를 높이면 순위가 바뀌어요. 다른 탭에 바로 반영돼요.</p>${K.map((k,i)=>`<label class="sl"><span>${k}</span><input type="range" min="0" max="1" step=".05" value="${W[i]}" aria-label="${k} 가중치" oninput="W[${i}]=+this.value;this.nextElementSibling.textContent=W[${i}].toFixed(2)"><em>${W[i].toFixed(2)}</em></label>`).join("")}<button class="btn" onclick="W[0]=W[1]=W[2]=1;draw()">초기화</button></section>
 <section class="card"><h2>계산 방법과 출처</h2><p class="small">위험도는 세 지표를 0~100으로 맞춘 뒤 가중 평균한 지역 간 상대 점수예요. 지도는 실제 위치를 단순화한 버블 지도예요.<br>출처: KOSIS 주민등록인구통계(2025.12), 인구주택총조사 가구(2025), 국민기초생활보장 수급자(2025). 1인가구비율은 1인가구÷일반가구, 수급자비율은 수급자(일반+시설)÷총인구예요.</p></section>`}};
function draw(){const R=calc();$("tabs").innerHTML=TABS.map(([k,n])=>`<button class="tab${k===tab?" on":""}" role="tab" aria-selected="${k===tab}" onclick="go('${k}')">${n}</button>`).join("");const v=$("view");v.className="";void v.offsetWidth;v.className="view";v.innerHTML=V[tab](R)}
function route(){const h=location.hash.slice(1);tab=V[h]?h:"home";draw();scrollTo(0,0)}
addEventListener("hashchange",route);matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);route();
</script></body></html>
